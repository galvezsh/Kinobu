# Tokyo Night (enkia, folke; MIT): city lights at night. Day's text is darker than the original,
# for contrast
name = "Tokyo Night"
description = "Neon blues and purples of the city at night."
author = "Kinobu, on Tokyo Night by enkia and folke (MIT)"
gnome_accent = "blue"
icons = "Papirus"
cursor = "Bibata-Modern-Classic"
button_layout = "appmenu:minimize,maximize,close"
wallhaven = "neon city"                # Seasons' "For this theme" search on Wallhaven (in English)
wallhaven_colour = "333399"          # one of Wallhaven's colours
# Its four wallpapers, from Wallhaven: downloaded by the user when the theme is applied
wallpapers = ["wallhaven:md3vjm", "wallhaven:83do1o", "wallhaven:4l3pmr", "wallhaven:2evx9g"]
intensity = 1

# The palettes, in the order Seasons shows them (the first is the default). Each one is dark
# or light; "pair" is the palette of the other mode the dark-style switch moves to.

[palettes.night]
name = "Night"
mode = "dark"
pair = "day"
terminal = "Tokyo Night"         # a palette of Ptyxis (its dark side when it has two)
accent = "#7AA2F7"
background = "#1A1B26"
view = "#16161E"
sidebar = "#16161E"
card = "#24283B"
foreground = "#C0CAF5"
muted = "#A9B1D6"
success = "#9ECE6A"
warning = "#E0AF68"
error = "#F7768E"

[palettes.storm]
name = "Storm"
mode = "dark"
pair = "day"
terminal = "Tokyo Night Storm"         # a palette of Ptyxis (its dark side when it has two)
accent = "#7AA2F7"
background = "#24283B"
view = "#1F2335"
sidebar = "#1F2335"
card = "#292E42"
foreground = "#C0CAF5"
muted = "#A9B1D6"
success = "#9ECE6A"
warning = "#E0AF68"
error = "#F7768E"

[palettes.moon]
