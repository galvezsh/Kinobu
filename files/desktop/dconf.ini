[org/gnome/desktop/interface]
accent-color='@ACCENT@'
color-scheme='@COLOR_SCHEME@'
gtk-theme='Yaru-@ACCENT@-dark'
icon-theme='Yaru-@ACCENT@-dark'
clock-format='24h'
clock-show-weekday=true
clock-show-date=true
clock-show-seconds=false

[org/gtk/settings/file-chooser]
clock-format='24h'

[org/gnome/desktop/wm/preferences]
button-layout=':minimize,maximize,close'
num-workspaces=@WORKSPACES@

[org/gnome/mutter]
dynamic-workspaces=false
workspaces-only-on-primary=false

[org/gnome/desktop/session]
idle-delay=uint32 @IDLE_DELAY@

[org/gnome/settings-daemon/plugins/power]
power-button-action='suspend'
sleep-inactive-ac-timeout=@SLEEP_ON_AC@
sleep-inactive-ac-type='suspend'
sleep-inactive-battery-timeout=@SLEEP_ON_BATTERY@
sleep-inactive-battery-type='suspend'

[org/gnome/desktop/sound]
allow-volume-above-100-percent=true

[org/gnome/desktop/privacy]
report-technical-problems=false

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'

[org/gtk/gtk4/settings/file-chooser]
show-hidden=true
sort-directories-first=true

[org/gnome/shell/weather]
automatic-location=false
locations=[@WEATHER_LOCATION@]

[org/gnome/Weather]
locations=[@WEATHER_LOCATION@]

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
dock-fixed=false
extend-height=false
show-mounts-network=true
show-mounts-only-mounted=true

[org/gnome/shell/extensions/ding]
start-corner='top-left'

[org/gnome/shell/extensions/tiling-assistant]
tiling-popup-all-workspace=true

[org/gnome/shell/extensions/caffeine]
indicator-position-max=1

[org/gnome/shell/extensions/clipboard-indicator]
display-mode=3

[org/gnome/shell/extensions/coverflowalttab]
switcher-background-color=(1.0, 1.0, 1.0)

[org/gnome/shell/extensions/weather-oclock]
weather-after-clock=true
