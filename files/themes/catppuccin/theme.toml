# Catppuccin (MIT): soothing pastels in four flavours, and Dracula and Alucard (Zeno Rocha, MIT)
# blended with them: Dracula's purple and text on Catppuccin's calmer greys and status colours.
# Frappé's text and Latte's are a touch stronger than the original, for contrast
name = "Catppuccin"
description = "Soothing pastels and purples: Catppuccin's flavours, with Dracula and Alucard."
author = "Kinobu, on Catppuccin (MIT) and Dracula by Zeno Rocha (MIT)"
gnome_accent = "purple"
folders = "violet"                        # Papirus' folders in mauve (else the accent's nearest colour)
icons = "Papirus"
cursor = { dark = "catppuccin-mocha-dark-cursors", light = "catppuccin-latte-light-cursors" }
button_layout = "appmenu:minimize,maximize,close"
wallhaven = "pastel"                # Seasons' "For this theme" search on Wallhaven (in English)
# Its four wallpapers, from Wallhaven: downloaded by the user when the theme is applied
wallpapers = ["wallhaven:5ymyz7", "wallhaven:d65ppm", "wallhaven:j3l5om", "wallhaven:mlzgz9"]
intensity = 1

# The palettes, in the order Seasons shows them (the first is the default). Each one is dark
# or light; "pair" is the palette of the other mode the dark-style switch moves to.

[palettes.mocha]
name = "Mocha"
mode = "dark"
pair = "latte"
terminal = "Catppuccin Mocha"         # a palette of Ptyxis (its dark side when it has two)
accent = "#CBA6F7"
background = "#1E1E2E"
view = "#181825"
sidebar = "#181825"
card = "#313244"
foreground = "#CDD6F4"
muted = "#A6ADC8"
success = "#A6E3A1"
warning = "#F9E2AF"
error = "#F38BA8"

